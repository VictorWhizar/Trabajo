<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Captura de Datos</title>
</head>
<body>

  <h2>Captura de Datos</h2>

  <form id="formulario" action="https://script.google.com/macros/s/AKfycbzkhRZgBY-KfRm6PCJqg59wOXk1LUFbVhmhXmGd8c8pFrewTczipqg-Z48Wf3Ax2SHxzQ/exec" method="POST" target="hidden_iframe" onsubmit="enviado()">
    <label for="nombre">Nombre:</label><br>
    <input type="text" id="nombre" name="nombre" required><br><br>

    <label for="edad">Edad:</label><br>
    <input type="number" id="edad" name="edad" required min="1" max="120"><br><br>

    <label for="genero">Genero:</label><br>
    <input type="text" id="genero" name="genero" required><br><br>

   <label for="nacionalidad">Nacionalidad:</label><br>
   <input type="text" id="nacionalidad" name="nacionalidad" required><br><br>

   <label for="ocupacion">Ocupación:</label><br>
   <input type="ocupacion" id="ocupacion" name="ocupacion" required><br><br>

   <label for="estadocivil">Estado civil:</label><br>
   <input type="estadocivil" id="estadocivil" name="estadocivil" required><br><br>

   <label for="correoelectronico">Correo Electrónico:</label><br>
   <input type="correoelectronico" id="correoelectronico" name="correoelectronico" required><br><br>
   

    <button type="submit" id="btnEnviar">Enviar</button>
  </form>

  <p id="estado"></p>

  <iframe name="hidden_iframe" id="hidden_iframe" style="display:none;"></iframe>

  <script>
    function enviado() {
      document.getElementById('btnEnviar').disabled = true;
      document.getElementById('estado').textContent = 'Guardando...';
      
      setTimeout(function() {
        document.getElementById('estado').textContent = '¡Registro guardado con éxito!';
        document.getElementById('formulario').reset();
        document.getElementById('btnEnviar').disabled = false;
      }, 1500);
    }
  </script>

</body>
</html>
